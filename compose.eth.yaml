# ETH compose file with node profiles and multi-DB support
#
# Usage:
# [reset]
#   docker compose -f compose.eth.yaml down -v
#
# [anvil node only]
#   docker compose -f compose.eth.yaml --profile anvil up
#
# [anvil + postgres]
#   docker compose -f compose.eth.yaml --profile anvil --profile postgres up
#
# [anvil + mysql]
#   docker compose -f compose.eth.yaml --profile anvil --profile mysql up
#
# [geth + lodestar node only]
#   docker compose -f compose.eth.yaml --profile geth up
#
# [geth + postgres]
#   docker compose -f compose.eth.yaml --profile geth --profile postgres up
#
# [call JSON-RPC on anvil]
#   curl -X POST -H "Content-Type: application/json" \
#     --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
#     http://localhost:${ANVIL_RPC_PORT:-8546}

volumes:
  eth-postgres: {}
  eth-mysql: {}

networks:
  eth:
    name: eth
    driver: bridge

# Common migration service configuration templates
x-postgres-migration-base: &postgres-migration-base
  image: arigaio/atlas:1.1.0
  profiles: ["postgres"]
  volumes:
    - "./tools/atlas:/app/atlas"
  working_dir: /app/atlas
  depends_on:
    eth-postgres:
      condition: service_healthy
  networks:
    - eth
  environment:
    - ATLAS_NO_UPDATE_NOTIFIER=true
  restart: "no"

x-mysql-migration-base: &mysql-migration-base
  image: arigaio/atlas:1.1.0
  profiles: ["mysql"]
  volumes:
    - "./tools/atlas:/app/atlas"
  working_dir: /app/atlas
  depends_on:
    eth-mysql:
      condition: service_healthy
  networks:
    - eth
  environment:
    - ATLAS_NO_UPDATE_NOTIFIER=true
  restart: "no"

services:
  #########################################################################
  # foundry/anvil
  # - https://getfoundry.sh/anvil/overview/
  #------------------------------------------------------------------------
  # Profile: anvil
  # Example:
  #   docker compose -f compose.eth.yaml --profile anvil up
  #
  # Notes:
  # - Uses custom mnemonic to avoid EIP-7702 delegation on default accounts
  # - Defaults to port 8546 to run alongside geth/ganache
  # - Designed to run independently (no dependencies)
  # - Fork mainnet/testnet: ANVIL_FORK_URL="https://..." ... up anvil
  #
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    profiles: ["anvil"]
    container_name: anvil
    ports:
      - "${ANVIL_RPC_PORT:-8546}:8545"
    volumes:
      - ./docker/nodes/eth/anvil-data:/anvil_data
    networks:
      - eth
    healthcheck:
      test:
        - CMD-SHELL
        - >
          bash -c 'payload="{\"jsonrpc\":\"2.0\",\"method\":\"web3_clientVersion\",\"params\":[],\"id\":1}"; length=$$(printf "%s" "$$payload" | wc -c | tr -d " "); request=$$(printf "POST / HTTP/1.1\r\nHost: localhost\r\nContent-Type: application/json\r\nContent-Length: %s\r\nConnection: close\r\n\r\n%s" "$$length" "$$payload"); exec 3<>/dev/tcp/localhost/8545 && printf "%s" "$$request" >&3 && read -r line <&3 && echo "$$line" | grep -q "200"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    entrypoint: ["bash", "-c"]
    command:
      - >
        ANVIL_ARGS=""; if [ -n "${ANVIL_FORK_URL:-}" ]; then
          ANVIL_ARGS="--fork-url ${ANVIL_FORK_URL:-}";
        fi; exec anvil --host 0.0.0.0 --port 8545 --chain-id ${ANVIL_CHAIN_ID:-31337} --mnemonic "${ANVIL_MNEMONIC:-toy echo orbit embrace opinion file client report history bomb regret life}" --block-time ${ANVIL_BLOCK_TIME:-1} $${ANVIL_ARGS}

  #########################################################################
  # ethereum/client-go (Geth)
  # - https://github.com/ethereum/go-ethereum/wiki/Running-in-Docker
  #------------------------------------------------------------------------
  # Profile: geth
  # Example:
  #   docker compose -f compose.eth.yaml --profile geth up
  #
  # Notes:
  # - Use console inside container:
  #     docker compose -f compose.eth.yaml exec geth sh
  #     geth attach ipc:///data/geth.ipc
  # - Call JSON-RPC:
  #     curl -X POST -H "Content-Type: application/json" \
  #       --data '{"jsonrpc":"2.0","method":"eth_syncing","params":[],"id":1}' \
  #       http://localhost:8545
  #########################################################################
  geth:
    # https://hub.docker.com/r/ethereum/client-go/
    image: built-client-go:${GETH_VERSION:-latest}
    profiles: ["geth"]
    build:
      context: .
      dockerfile: ./docker/nodes/eth/Dockerfile.geth
      args:
        - VERSION=${GETH_VERSION:-latest}
    container_name: ${TARGET_NETWORK}-geth
    volumes:
      - ./docker/nodes/eth/${TARGET_NETWORK}:/data
      - ./docker/nodes/eth/configs/jwtsecret:/secret/jwtsecret
    ports:
      #- "8551:8551" # Authorization Port
      - ${GETH_HTTP_PORT:-8545}:${GETH_HTTP_PORT:-8545} # RPC Port
      - 0.0.0.0:30303:30303/tcp
      - 0.0.0.0:30303:30303/udp
    command:
      - --${TARGET_NETWORK} # network. e.g. sepolia
      - --networkid=11155111
      - --datadir=/data
      - --http
      - --http.api=web3,eth,net,admin
      - --http.addr=0.0.0.0
      - --http.port=${GETH_HTTP_PORT:-8545}
      - --http.vhosts=*
      - --http.corsdomain=*
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.vhosts=*
      - --authrpc.jwtsecret=/secret/jwtsecret
      - --port=30303
      - --maxpeers=100
      - --cache=4096
      #- --verbosity=4
    networks:
      - eth
    healthcheck:
      test: ["CMD", "curl", "-X", "POST", "-H", "Content-Type: application/json", "--data", '{"jsonrpc":"2.0","method":"eth_getBlockByNumber","params":["0x0", false]}', "http://127.0.0.1:${GETH_HTTP_PORT:-8545}"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Consensus layer client for Geth (required for post-Merge networks)
  # Apple Silicon MacOS may not run — https://github.com/ChainSafe/lodestar/issues/4801
  # lodestar version must be v1.4.0-rc.1 or higher
  lodestar:
    # https://hub.docker.com/r/chainsafe/lodestar
    image: "chainsafe/lodestar:${LODESTAR_VERSION:-latest}"
    profiles: ["geth"]
    container_name: ${TARGET_NETWORK}-lodestar
    volumes:
      - ./docker/nodes/eth/${TARGET_NETWORK}:/data
      - ./docker/nodes/eth/configs/jwtsecret:/secret/jwtsecret
    ports:
      - ${BEACON_HTTP_PORT:-9596}:${BEACON_HTTP_PORT:-9596} # REST API port
      - 0.0.0.0:9000:9000/tcp
      - 0.0.0.0:9000:9000/udp
    environment:
      NODE_OPTIONS: --max-old-space-size=4096
    command:
      - beacon
      - --checkpointSyncUrl=${CHECKPOINT_SYNC_URL}
      - --network=${TARGET_NETWORK}
      - --dataDir=/data/lodestar
      - --eth1=true
      - --eth1.providerUrls=http://${TARGET_NETWORK}-geth:${GETH_HTTP_PORT}
      - --execution.urls=http://${TARGET_NETWORK}-geth:8551
      - --rest.address=0.0.0.0
      - --rest.namespace='*'
      - --jwt-secret=/secret/jwtsecret
      - --targetPeers=50
      #- --logLevel=debug
      - --logFile=/data/lodestar/beacon.log
      #- --logFileLevel=debug
      - --logFileDailyRotate=5
    depends_on:
      geth:
        condition: service_healthy
    networks:
      - eth
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BEACON_HTTP_PORT:-9596}/eth/v1/node/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  #########################################################################
  # PostgreSQL Database
  # Profile: postgres
  # Example:
  #   docker compose -f compose.eth.yaml --profile anvil --profile postgres up
  #########################################################################
  eth-postgres:
    image: postgres:18.2
    profiles: ["postgres"]
    container_name: eth-postgres
    volumes:
      # IMPORTANT: PostgreSQL 18+ uses version-specific subdirectories under /var/lib/postgresql
      - eth-postgres:/var/lib/postgresql
      - "./docker/postgres/init.d:/docker-entrypoint-initdb.d"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRESQL_PORT:-5432}:5432"
    networks:
      - eth
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  #########################################################################
  # MySQL Database
  # Profile: mysql
  # Example:
  #   docker compose -f compose.eth.yaml --profile anvil --profile mysql up
  #
  # Note: MySQL 8.4 uses caching_sha2_password by default (requires SSL).
  # Connect with: mysql -h localhost -u hiromaily -p --ssl-mode=REQUIRED
  #########################################################################
  eth-mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    container_name: eth-mysql
    volumes:
      - eth-mysql:/var/lib/mysql
      - "./docker/mysql/conf.d:/etc/mysql/conf.d"
      - "./docker/mysql/init.d:/docker-entrypoint-initdb.d"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: hiromaily
      MYSQL_PASSWORD: hiromaily
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - eth
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  #########################################################################
  # PostgreSQL Migration (Atlas)
  # Activated with --profile postgres
  #########################################################################
  eth-postgres-migrate-watch:
    !!merge <<: *postgres-migration-base
    container_name: eth-postgres-migrate-watch
    command:
      - migrate
      - apply
      - --dir
      - "file://migrations/postgres/watch"
      - --url
      - "postgres://postgres:postgres@eth-postgres:5432/watch?sslmode=disable"

  eth-postgres-migrate-keygen:
    !!merge <<: *postgres-migration-base
    container_name: eth-postgres-migrate-keygen
    command:
      - migrate
      - apply
      - --dir
      - "file://migrations/postgres/keygen"
      - --url
      - "postgres://postgres:postgres@eth-postgres:5432/keygen?sslmode=disable"

  eth-postgres-migrate-sign:
    !!merge <<: *postgres-migration-base
    container_name: eth-postgres-migrate-sign
    command:
      - migrate
      - apply
      - --dir
      - "file://migrations/postgres/sign"
      - --url
      - "postgres://postgres:postgres@eth-postgres:5432/sign?sslmode=disable"

  #########################################################################
  # MySQL Migration (Atlas)
  # Activated with --profile mysql
  #########################################################################
  eth-mysql-migrate-watch:
    !!merge <<: *mysql-migration-base
    container_name: eth-mysql-migrate-watch
    command:
      - migrate
      - apply
      - --dir
      - file://migrations/mysql/watch
      - --url
      - "mysql://root:root@eth-mysql:3306/watch?charset=utf8mb4&parseTime=True&loc=Local"

  eth-mysql-migrate-keygen:
    !!merge <<: *mysql-migration-base
    container_name: eth-mysql-migrate-keygen
    command:
      - migrate
      - apply
      - --dir
      - file://migrations/mysql/keygen
      - --url
      - "mysql://root:root@eth-mysql:3306/keygen?charset=utf8mb4&parseTime=True&loc=Local"

  eth-mysql-migrate-sign:
    !!merge <<: *mysql-migration-base
    container_name: eth-mysql-migrate-sign
    command:
      - migrate
      - apply
      - --dir
      - file://migrations/mysql/sign
      - --url
      - "mysql://root:root@eth-mysql:3306/sign?charset=utf8mb4&parseTime=True&loc=Local"
