version: "2"

# Active 46 linters, 65s
# go tool golangci-lint run -v

run:
  go: "1.26.2"
  timeout: 5m
  concurrency: 8
  modules-download-mode: readonly
  allow-parallel-runners: true
  # Build tags to include when linting.
  # This ensures files with build tags (e.g., //go:build integration) are also linted.
  build-tags:
    - integration

issues:
  # Maximum issues count per one linter. Set to 0 to disable. Default is 50.
  max-issues-per-linter: 0
  # Maximum count of issues with the same text. Set to 0 to disable. Default is 3.
  max-same-issues: 0

formatters:
  enable:
    - gofumpt # Detects whether code was gofumpt-ed.
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hiromaily
  exclusions:
    generated: strict

linters:
  # when `default: fast` set, `enable:` ignored
  # default: fast
  enable:
    - asasalint # Detects "[]any" used as argument for variadic "func(...any)".
    - bodyclose
    - copyloopvar # Detects places where loop variables are copied.
    - depguard
    - dogsled # Detects assignments with too many blank identifiers.
    - dupword # Detects duplicate words.
    - durationcheck # Detect cases where two time.Duration values are being multiplied in possibly erroneous ways.
    - errcheck
    - errchkjson # Detects unsupported types passed to json encoding functions and reports if checks for the returned error can be omitted.
    - exhaustive # Detects missing options in enum switch statements.
    - exptostd # Detects functions from golang.org/x/exp/ that can be replaced by std functions.
    - fatcontext # Detects nested contexts in loops and function literals.
    - forbidigo
    - gocheckcompilerdirectives # Detects invalid go compiler directive comments (//go:).
    - gocritic # Metalinter; detects bugs, performance, and styling issues.
    - gocyclo
    - gosec # Detects security problems.
    - govet
    - iface # Detects incorrect use of interfaces. Currently only used for "identical" interfaces in the same package.
    - importas # Enforces consistent import aliases.
    - ineffassign
    - makezero # Finds slice declarations with non-zero initial length.
    - mirror # Detects wrong mirror patterns of bytes/strings usage.
    - misspell # Detects commonly misspelled English words in comments.
    - modernize # Suggests simplifications using modern Go language and library features.
    - nakedret # Detects uses of naked returns.
    - nilnesserr # Detects returning nil errors. It combines the features of nilness and nilerr,
    - nosprintfhostport # Detects misuse of Sprintf to construct a host with port in a URL.
    - nolintlint # Detects ill-formed or insufficient nolint directives.
    - perfsprint # Detects fmt.Sprintf uses that can be replaced with a faster alternative.
    - prealloc # Detects slice declarations that could potentially be pre-allocated.
    - predeclared # Detects code that shadows one of Go's predeclared identifiers
    - reassign # Detects reassigning a top-level variable in another package.
    - revive # Metalinter; drop-in replacement for golint.
    - spancheck # Detects mistakes with OpenTelemetry/Census spans.
    - staticcheck
    - thelper # Detects test helpers without t.Helper().
    - tparallel # Detects inappropriate usage of t.Parallel().
    - unconvert # Detects unnecessary type conversions.
    - unparam
    - unused
    - usestdlibvars # Detects the possibility to use variables/constants from the Go standard library.
    - usetesting # Reports uses of functions with replacement inside the testing package.
    - wastedassign # Detects wasted assignment statements.

  settings:
    depguard:
      rules:
        websocket:
          deny:
            - pkg: "nhooyr.io/websocket"
              desc: The containerd websocket package was migrated to a separate module. Use github.com/coder/websocket instead.

    exhaustive:
      default-signifies-exhaustive: true

    forbidigo:
      forbid:
        - pkg: ^regexp$
          pattern: ^regexp\.MustCompile
          msg: Use internal/lazyregexp.New instead.

    gocritic:
      enabled-checks:
        - ruleguard
      disabled-checks:
        - ifElseChain
      settings:
        ruleguard:
          rules: "tools/lint/rules.go"

    gocyclo:
      min-complexity: 16

    gosec:
      excludes:
        - G104 # G104: Errors unhandled;
        - G115 # G115: integer overflow conversion;
        - G117 # G117: Exported struct field matches secret pattern (false positive: intentionally named config/domain fields like Pass, Secret, PrivateKey)
        - G306 # G306: Expect WriteFile permissions to be 0600 or less (too restrictive; also flags "0o644" permissions)
        - G307 # G307: Deferring unsafe method
        - G703 # G703: Path traversal via taint analysis (false positive: acceptable in test config utility and controlled internal paths)
        # G103: Use of unsafe calls should be audited (includes panic detection)
        # Note: panic is allowed only in instance construction phase (main.go and pkg/di)

    govet:
      enable:
        - shadow
      settings:
        shadow:
          strict: true

    lll:
      line-length: 120

    importas:
      # Do not allow unaliased imports of aliased packages.
      no-unaliased: true

      # set aliases for packages
      alias:
        # Application DTOs
        - pkg: github.com/hiromaily/go-crypto-wallet/internal/application/dto/btc
          alias: dtobtc
        - pkg: github.com/hiromaily/go-crypto-wallet/internal/application/dto/eth
          alias: dtoeth
        - pkg: github.com/hiromaily/go-crypto-wallet/internal/application/dto/xrp
          alias: dtoxrp
        # Application Ports - API
        - pkg: github.com/hiromaily/go-crypto-wallet/internal/application/ports/api/btc
          alias: apibtc
        - pkg: github.com/hiromaily/go-crypto-wallet/internal/application/ports/api/eth
          alias: apieth
        - pkg: github.com/hiromaily/go-crypto-wallet/internal/application/ports/api/xrp
          alias: apixrp
        # Infrastructure API implementations
        - pkg: github.com/hiromaily/go-crypto-wallet/internal/infrastructure/api/btc/btc
          alias: apibtcimpl
        - pkg: github.com/hiromaily/go-crypto-wallet/internal/infrastructure/api/btc/bch
          alias: apibchimpl
        - pkg: github.com/hiromaily/go-crypto-wallet/internal/infrastructure/api/eth/eth
          alias: apiethimpl
        - pkg: github.com/hiromaily/go-crypto-wallet/internal/infrastructure/api/eth/erc20
          alias: apierc20impl
        - pkg: github.com/hiromaily/go-crypto-wallet/internal/infrastructure/api/xrp
          alias: apixrpimpl
          # - pkg: github.com/hiromaily/go-crypto-wallet/internal/infrastructure/db/mysql/sqlcgen
          #   alias: sqlcgen
    nakedret:
      # Disallow naked returns if func has more lines of code than this setting.
      # Default: 30
      max-func-lines: 0

    staticcheck:
      checks:
        - all
        - -QF1008 # Omit embedded fields from selector expression; https://staticcheck.dev/docs/checks/#QF1008

    revive:
      rules:
        - name: empty-block # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#empty-block
        - name: empty-lines # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#empty-lines
        - name: line-length-limit # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#line-length-limit
          arguments: [120]
        - name: unused-receiver # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#unused-receiver
        - name: use-any # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#use-any
        - name: use-errors-new # https://github.com/mgechev/revive/blob/HEAD/RULES_DESCRIPTIONS.md#use-errors-new
          # - name: import-shadowing  # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#import-shadowing

    usetesting:
      os-chdir: false # FIXME(thaJeztah): Disable `os.Chdir()` detections; should be automatically disabled on Go < 1.24; see https://github.com/docker/cli/pull/5835#issuecomment-2665302478
      context-background: false # FIXME(thaJeztah): Disable `context.Background()` detections; should be automatically disabled on Go < 1.24; see https://github.com/docker/cli/pull/5835#issuecomment-2665302478
      context-todo: false # FIXME(thaJeztah): Disable `context.TODO()` detections; should be automatically disabled on Go < 1.24; see https://github.com/docker/cli/pull/5835#issuecomment-2665302478

  exclusions:
    generated: strict

    rules:
      # Exclude some linters from running on tests files.
      - path: _test\.go
        linters:
          - gosec
      - text: "ST1000: at least one file in a package should have a package comment"
        linters:
          - staticcheck
      - text: 'declaration of "err" shadows declaration'
        linters:
          - govet
      # Exclude SA1019 (deprecated) warnings - these are expected for backward compatibility
      - text: "SA1019:"
        linters:
          - staticcheck
      # Allow panic in instance construction phase (main.go and pkg/di package)
      # Following separation of concerns: instance construction vs instance usage
      - path: ^cmd/.*/main\.go$
        linters:
          - gosec
        text: "G103:"
      - path: ^pkg/di/.*\.go$
        linters:
          - gosec
        text: "G103:"
      # Exclude Ethereum-related words from crypto naming rule (valid English words)
      - text: "Ethereumer should use BTC, ETH, or XRP"
        linters:
          - gocritic
      - text: "Ethereum should use BTC, ETH, or XRP"
        linters:
          - gocritic
      - text: "EtherTxMonitor should use BTC, ETH, or XRP"
        linters:
          - gocritic
      # Exclude converter functions from unparam (kept for consistency and future-proofing)
      - text: "convertTo.* - result .* is always nil"
        linters:
          - unparam
      # Exclude complex PSBT functions from gocyclo (Bitcoin transaction logic is inherently complex)
      - text: "cyclomatic complexity .* of func `\\(\\*Bitcoin\\).(SignPSBTWithKey|FinalizePSBT|finalizeMultisigInput|addBIP32DerivationFromDescriptor|getDescriptorInfoForAddress)`"
        linters:
          - gocyclo
        path: internal/infrastructure/api/btc/btc/psbt\.go
      # Exclude complex descriptor generation from gocyclo (BIP44/49/84/86 logic is complex)
      - text: "cyclomatic complexity .* of func `\\(\\*generateDescriptorUseCase\\).generateSingleSigDescriptor`"
        linters:
          - gocyclo
        path: internal/application/usecase/keygen/btc/generate_descriptor\.go
      # Exclude complex signing logic from gocyclo (multisig signing has many edge cases)
      - text: "cyclomatic complexity .* of func `\\(\\*signTransactionUseCase\\).signWithAccount`"
        linters:
          - gocyclo
        path: internal/application/usecase/keygen/btc/sign_transaction\.go
      # Exclude complex address derivation from gocyclo (BIP derivation has many paths)
      - text: "cyclomatic complexity .* of func `deriveAddressForType`"
        linters:
          - gocyclo
        path: internal/application/usecase/watch/btc/import_descriptor\.go
      # Exclude test functions from gocyclo (comprehensive test cases are acceptable)
      - text: "cyclomatic complexity .* of func `TestDescriptorGenerator_GenerateAccountDescriptor`"
        linters:
          - gocyclo
        path: internal/infrastructure/wallet/key/descriptor_test\.go
      # Exclude key generation from gocyclo (BTC/BCH/ETH key generation has many coin-specific paths)
      - text: "cyclomatic complexity .* of func `\\(\\*HDKey\\).createKeysWithIndex`"
        linters:
          - gocyclo
        path: internal/infrastructure/wallet/key/hd_wallet\.go

    # Exclude files from all linters.
    paths:
      - ".*\\.pb\\.go"
      - "mocks/.*"
      #- ".*\\.test\\.go"

    # Log a warning if an exclusion rule is unused.
    # Default: false
    warn-unused: true
