# buf.gen.yaml - Code generation configuration
# https://buf.build/docs/configuration/v2/buf-gen-yaml
version: v2

# Managed mode is disabled to preserve existing go_package options in proto files
# The proto files already have the correct go_package options defined
managed:
  enabled: false

# Plugins for Go code generation
plugins:
  # Generate Go protocol buffer code
  - remote: buf.build/protocolbuffers/go
    out: internal/infrastructure/api/xrp/protogen
    opt:
      - paths=source_relative

  # Generate Go gRPC service code
  - remote: buf.build/grpc/go
    out: internal/infrastructure/api/xrp/protogen
    opt:
      - paths=source_relative

  # Generate TypeScript protocol buffer code using protoc-gen-es
  # Note: Using local plugins. Once buf CLI >= 1.64.0 adds Edition 2024 support,
  # these will work with the edition 2024 proto files.
  # Until then, generation will fail with "edition 2024 not yet fully supported"
  - local: protoc-gen-es
    out: apps/xrpl-grpc-server/src/protogen
    opt: target=ts

  # Generate Connect-ES service code for gRPC-web
  - local: protoc-gen-connect-es
    out: apps/xrpl-grpc-server/src/protogen
    opt: target=ts

# Input directories
# Note: third_party proto files are not included as inputs since they are
# provided by the protobuf runtime (google.golang.org/protobuf/types/known)
inputs:
  - directory: proto/rippleapi
