edition = "2024";

package xrpapi.address;

import "google/protobuf/empty.proto";

// Use proto3 semantics for field presence (implicit presence)
// This maintains backward compatibility with existing Go code
option features.field_presence = IMPLICIT;
// Allow existing camelCase field names without requiring snake_case
option features.enforce_naming_style = STYLE_LEGACY;
option go_package = "github.com/hiromaily/go-crypto-wallet/pkg/chains/xrp/protogen";

message ResponseGenerateAddress {
  string xAddress = 1;
  string classicAddress = 2;
  string address = 3;
  string secret = 4;
}

message ResponseGenerateXAddress {
  string xAddress = 1;
  string secret = 2;
}

message RequestIsValidAddress { string address = 1; }

message ResponseIsValidAddress { bool isValid = 1; }

// XRPAddressAPI
service XRPAddressAPI {
  // https://xrpl.org/rippleapi-reference.html#generateaddress
  rpc GenerateAddress(google.protobuf.Empty) returns (ResponseGenerateAddress) {
  }
  // https://xrpl.org/rippleapi-reference.html#generatexaddress
  rpc GenerateXAddress(google.protobuf.Empty)
      returns (ResponseGenerateXAddress) {}
  // https://xrpl.org/rippleapi-reference.html#isvalidaddress
  rpc IsValidAddress(RequestIsValidAddress) returns (ResponseIsValidAddress) {}
}
