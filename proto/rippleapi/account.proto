edition = "2024";

package rippleapi.account;

// Use proto3 semantics for field presence (implicit presence)
// This maintains backward compatibility with existing Go code
option features.field_presence = IMPLICIT;
// Allow existing camelCase field names without requiring snake_case
option features.enforce_naming_style = STYLE_LEGACY;
option go_package = "github.com/hiromaily/go-crypto-wallet/internal/infrastructure/api/xrp/protogen";

message RequestGetAccountInfo {
  string address = 1;
  //uint64 ledgerVersion = 2;
}

message ResponseGetAccountInfo {
  uint64 sequence = 1;
  string xrpBalance = 2;
  uint64 ownerCount = 3;
  string previousAffectingTransactionID = 4;
  uint64 previousAffectingTransactionLedgerVersion = 5;
}

// RippleAccountAPI
service RippleAccountAPI {
  // https://xrpl.org/rippleapi-reference.html#getaccountinfo
  rpc GetAccountInfo(RequestGetAccountInfo) returns (ResponseGetAccountInfo) {}
}
