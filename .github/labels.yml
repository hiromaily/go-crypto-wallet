# GitHub Labels Configuration
# This file manages all labels for the repository
# See: https://docs.github.com/en/rest/reference/issues#labels

# Type Labels
- name: bug
  color: d73a4a
  description: Something isn't working

- name: enhancement
  color: a2eeef
  description: New feature or request

- name: refactoring
  color: 0e8a16
  description: Code refactoring without changing functionality

- name: documentation
  color: 0075ca
  description: Documentation updates or improvements

- name: security
  color: ee0701
  description: Security-related issues or improvements

- name: technical-debt
  color: fbca04
  description: Code quality improvements and cleanup tasks

# Status Labels
- name: duplicate
  color: cfd3d7
  description: This issue or pull request already exists

- name: invalid
  color: e4e669
  description: This doesn't seem right

- name: question
  color: d876e3
  description: Further information is requested

- name: wontfix
  color: ffffff
  description: This will not be worked on

- name: help wanted
  color: 008672
  description: Extra attention is needed

- name: good first issue
  color: 7057ff
  description: Good for newcomers

# Dependency Labels
- name: dependencies
  color: 0366d6
  description: Pull requests that update a dependency file

