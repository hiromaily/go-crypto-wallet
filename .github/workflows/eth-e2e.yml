name: ETH E2E Tests
on:
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "scripts/operation/eth/**/*.sh"
      - "scripts/operation/common.sh"
      - "config/wallet/eth/**"
      - "make/wallet/eth.mk"
      - "make/wallet/eth_e2e.mk"
      - "apps/eth-contracts/**"
      - "compose.eth.yaml"
      - ".github/workflows/eth-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "scripts/operation/eth/**/*.sh"
      - "scripts/operation/common.sh"
      - "config/wallet/eth/**"
      - "make/wallet/eth.mk"
      - "make/wallet/eth_e2e.mk"
      - "apps/eth-contracts/**"
      - "compose.eth.yaml"
      - ".github/workflows/eth-e2e.yml"
  workflow_dispatch:
    inputs:
      node_type:
        description: "Ethereum node type"
        required: false
        default: "anvil"
        type: choice
        options:
          - anvil
          - geth
      patterns:
        description: "Patterns to run (e.g., 1-2 or 1,2)"
        required: false
        default: "1-2"
      max_parallel:
        description: "Max parallel processes"
        required: false
        default: "2"

env:
  GO_VERSION: "1.25.6"
  # Check for updates: https://github.com/docker/compose/releases
  # Note: v5.x requires Docker 28+, use v2.x for broader compatibility
  DOCKER_COMPOSE_VERSION: "2.40.3"

permissions:
  contents: read

jobs:
  eth-e2e-parallel:
    name: ETH E2E (Parallel)
    # ubuntu-latest required: Docker is pre-installed (ubuntu-slim lacks Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Docker Compose V2
        run: |
          # Install Docker Compose V2 plugin (supports 'docker compose' syntax)
          DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
          mkdir -p $DOCKER_CONFIG/cli-plugins
          compose_base=https://github.com/docker/compose/releases/download
          compose_url=${compose_base}/v${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-linux-x86_64
          curl -SL "${compose_url}" -o "$DOCKER_CONFIG/cli-plugins/docker-compose"
          chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
          docker compose version

      - name: Build project
        run: make build-all

      - name: Install Foundry (forge + cast)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install smart contract dependencies
        working-directory: apps/eth-contracts
        run: |
          # Install npm packages (@openzeppelin/contracts, solhint, etc.)
          bun install
          # Install forge libraries (forge-std) pinned by foundry.lock
          forge install

      - name: Pull Docker images
        run: |
          # ghcr.io can be slow on CI runners; retry up to 3 times
          for i in 1 2 3; do
            docker pull ghcr.io/foundry-rs/foundry:latest && break
            echo "Pull attempt ${i} failed, retrying in 10s..."
            sleep 10
          done

      - name: Run ETH E2E tests in parallel
        run: |
          PATTERNS="${{ github.event.inputs.patterns || '1-2' }}"
          MAX_PARALLEL="${{ github.event.inputs.max_parallel || '2' }}"
          NODE_TYPE="${{ github.event.inputs.node_type || 'anvil' }}" \
            ./scripts/operation/eth/e2e/e2e-parallel-runner.sh \
              --patterns "${PATTERNS}" \
              --max-parallel "${MAX_PARALLEL}" \
              --ci

      - name: Upload E2E logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: eth-e2e-logs
          path: data/logs/e2e-parallel-eth/
          retention-days: 7

      - name: Upload E2E SQLite databases on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: eth-e2e-databases
          path: data/sqlite/eth/
          retention-days: 3
