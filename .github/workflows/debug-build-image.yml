name: docker-build-debug (BuildKit Cache Dance)

# https://docs.docker.com/build/ci/github-actions/cache/#cache-mounts

# [cache: go-mod + go-build]
# 1. cache_version: v4-0203-1817, cd_skip_extraction: false, cd_rsync_mode: false, cd_is_debug: false, (1): 3m 1s
# 2. cache_version: v4-0203-1817, cd_skip_extraction: false, cd_rsync_mode: false, cd_is_debug: false, (2): 2m 29s
# 3. cache_version: v4-0203-1832, cd_skip_extraction: true, cd_rsync_mode: false, cd_is_debug: false, (1): 1m 37s
# 4. cache_version: v4-0203-1832, cd_skip_extraction: true, cd_rsync_mode: false, cd_is_debug: false, (2): 1m 50s
# 5. cache_version: v4-0203-1942, cd_skip_extraction: false, cd_rsync_mode: true, cd_is_debug: false, (1): 3m 20s
# 6. cache_version: v4-0203-1942, cd_skip_extraction: false, cd_rsync_mode: true, cd_is_debug: false, (2): 2m 32s
# => rsync mode does not work faster here
# 7. cache_version: v4-0203-1954, cd_skip_extraction: false, cd_rsync_mode: false, cd_is_debug: true, (1): 2m 47s
#  https://github.com/hiromaily/go-crypto-wallet/actions/runs/21627414312/job/62331033712
# 8. cache_version: v4-0203-1954, cd_skip_extraction: false, cd_rsync_mode: false, cd_is_debug: true, (2): 2m 50s
# 9. cache_version: v4-0203-2010, cd_skip_extraction: false, cd_rsync_mode: true, cd_is_debug: true, (1): 2m 45s
#  https://github.com/hiromaily/go-crypto-wallet/actions/runs/21627935973/job/62332804344
# => fix rsync mode bug
# 10. cache_version: v4-0203-2125, cd_skip_extraction: false, cd_rsync_mode: true, cd_is_debug: true, (1): 2m 41s
# 11. cache_version: v4-0203-2125, cd_skip_extraction: false, cd_rsync_mode: true, cd_is_debug: true, (2): 2m 29s
# [cache: go-build]

on:
  workflow_dispatch:
    inputs:
      cache_version:
        description: "Bump this to force a fresh actions/cache mount set"
        type: string
        default: "v4-0203-2313"
      include_go_mod:
        description: "true → include go-mod + go-build, false → only go-build"
        type: boolean
        default: false
      cd_skip_extraction:
        description: "Skip Cache Dance extraction (true/false)"
        type: boolean
        default: false
      cd_rsync_mode:
        description: "Cache Dance rsync mode (true/false)"
        type: boolean
        default: false
      cd_is_debug:
        description: "Cache Dance debug mode (true/false)"
        type: boolean
        default: false
      run_twice:
        description: "Build twice in the same job to verify cache hits"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write # for cache type=gha

env:
  DOCKERFILE: ./docker/Dockerfile
  CACHE_VERSION: ${{ inputs.cache_version }}
  CACHE_DIR: cache-mount
  GHA_CACHE_SCOPE: go-crypto-wallet
  CMD_PATH: cmd/watch
  CACHE_MAP_FULL: >
    { "go-mod": { "target": "/go/pkg/mod", "id": "go-mod" }, "go-build": { "target": "/root/.cache/go-build", "id": "go-build" } }
  CACHE_MAP_MIN: >
    { "go-build": { "target": "/root/.cache/go-build", "id": "go-build" } }

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (fetch tags)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        id: buildx

      # ----------------------------
      # 1) Restore cache mounts (actions/cache)
      # ----------------------------
      # - name: Restore cache mounts (BuildKit cache mounts)
      #   id: cache-restore
      #   uses: actions/cache/restore@v5
      #   with:
      #     path: ${{ env.CACHE_DIR }}
      #     key: ${{ runner.os }}-cache-mount-${{ env.CACHE_VERSION }}-${{ hashFiles(env.DOCKERFILE, 'go.mod', 'go.sum') }}
      #     restore-keys: |
      #       ${{ runner.os }}-cache-mount-${{ env.CACHE_VERSION }}-
      #       ${{ runner.os }}-cache-mount-

      # ----------------------------
      # 1) Restore + Save cache mounts (actions/cache)
      # ----------------------------
      # Cache mounts: restore now, save in post (after cache-dance extraction)
      - name: Cache mounts (restore + save in post)
        uses: actions/cache@v5
        with:
          path: ${{ env.CACHE_DIR }}
          key: ${{ runner.os }}-cache-mount-${{ env.CACHE_VERSION }}-${{ hashFiles(env.DOCKERFILE, 'go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-cache-mount-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-cache-mount-

      # ----------------------------
      # 2) Cache Dance (inject before build; extract in post)
      # ----------------------------
      - name: BuildKit Cache Dance (inject; extract in post)
        #uses: reproducible-containers/buildkit-cache-dance@v3
        uses: hiromaily/buildkit-cache-dance@v4
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: ${{ env.CACHE_DIR }}
          dockerfile: ${{ env.DOCKERFILE }}
          # cache-map: |
          #   {
          #     "go-mod":  { "target": "/go/pkg/mod", "id": "go-mod" },
          #     "go-build":{ "target": "/root/.cache/go-build", "id": "go-build" }
          #   }
          cache-map: ${{ inputs.include_go_mod == 'true' && env.CACHE_MAP_FULL || env.CACHE_MAP_MIN }}
          # Debug workflowなので常に extraction して、actions/cache/save できる形にする
          skip-extraction: ${{ inputs.cd_skip_extraction }}
          rsync-mode: ${{ inputs.cd_rsync_mode }}
          is-debug: ${{ inputs.cd_is_debug }}

      # ----------------------------
      # 3) Build (no push)
      #    - Use buildx GHA cache (cache-from/to)
      # ----------------------------
      # First: always run
      - name: Build (first)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: false
          # ローカルにロードしたい場合は true にする（任意）
          # load: true
          build-args: |
            CMD_PATH=${{ env.CMD_PATH }}
          # cache-from: type=gha,scope=${{ env.GHA_CACHE_SCOPE }}
          # cache-to: type=gha,mode=max,scope=${{ env.GHA_CACHE_SCOPE }}
          cache-from: type=gha,scope=df-${{ hashFiles(env.DOCKERFILE) }}
          cache-to: type=gha,mode=max,scope=df-${{ hashFiles(env.DOCKERFILE) }}

      # Second: check how it works by cache for debugging
      - name: Build (second; should be faster if caches work)
        if: ${{ inputs.run_twice }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: false
          build-args: |
            CMD_PATH=${{ env.CMD_PATH }}
          # cache-from: type=gha,scope=${{ env.GHA_CACHE_SCOPE }}
          # cache-to: type=gha,mode=max,scope=${{ env.GHA_CACHE_SCOPE }}
          cache-from: type=gha,scope=df-${{ hashFiles(env.DOCKERFILE) }}
          cache-to: type=gha,mode=max,scope=df-${{ hashFiles(env.DOCKERFILE) }}

      - name: Inspect cache-dir before post steps (for debug)
        run: |
          set -eux
          ls -lah "${CACHE_DIR}" || true
          du -sh "${CACHE_DIR}" || true
          find "${CACHE_DIR}" -maxdepth 2 -type f | head -50 || true

      # ----------------------------
      # 4) Save cache mounts (actions/cache)
      # ----------------------------
      # - name: Save cache mounts (BuildKit cache mounts)
      #   uses: actions/cache/save@v5
      #   with:
      #     path: ${{ env.CACHE_DIR }}
      #     key: ${{ runner.os }}-cache-mount-${{ env.CACHE_VERSION }}-${{ hashFiles(env.DOCKERFILE, 'go.mod', 'go.sum') }}
