name: Nightly Strict Lint
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
env:
  GO_VERSION: "1.25.6"
permissions:
  contents: read
jobs:
  # Full strict lint on the entire codebase (no --fast-only, no only-new-issues).
  # Uses ubuntu-latest because full-codebase analysis is CPU-intensive and
  # ubuntu-slim's reduced core count may cause timeouts at 15m.
  strict-lint:
    name: strict-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint (strict, full codebase)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
