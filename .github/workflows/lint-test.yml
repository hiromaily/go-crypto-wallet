name: Lint and Test
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "**.mdc"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "**.mdc"
env:
  GO_VERSION: "1.25.6"
jobs:
  # Detect which files changed to conditionally run jobs
  changes:
    runs-on: ubuntu-slim
    outputs:
      go: ${{ steps.filter.outputs.go }}
      proto: ${{ steps.filter.outputs.proto }}
      shell: ${{ steps.filter.outputs.shell }}
      sql: ${{ steps.filter.outputs.sql }}
      hcl: ${{ steps.filter.outputs.hcl }}
      ts: ${{ steps.filter.outputs.ts }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            proto:
              - 'proto/**/*.proto'
              - 'buf.yaml'
              - 'buf.gen.yaml'
            shell:
              - 'scripts/**/*.sh'
            sql:
              - 'tools/sqlc/**/*.sql'
              - 'tools/sqlc/sqlc.yml'
            hcl:
              - 'tools/atlas/**/*.hcl'
              - 'tools/atlas/atlas.hcl'
            ts:
              - 'apps/xrpl-grpc-server/**/*.ts'
              - 'apps/xrpl-grpc-server/package.json'
              - 'apps/xrpl-grpc-server/biome.json'
              - 'apps/xrpl-grpc-server/tsconfig.json'
  # Go linting
  # PR: only-new-issues=true checks only changed code (faster)
  # Push to main: full check for post-merge quality assurance
  go-lint:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    name: go-lint
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          # Required for only-new-issues to compare against base branch
          fetch-depth: 0
      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.8.0
          working-directory: ./
          # PR: Report only new issues introduced in the PR (uses --new-from-rev internally)
          # Push: Report all issues (default behavior when not a PR)
          only-new-issues: true
  # Proto linting and formatting
  # NOTE: buf format/lint disabled - buf CLI v1.63.0 doesn't support edition 2024
  # Using clang-format for proto formatting instead
  # See: docs/proto.md for details
  proto-lint:
    needs: changes
    if: ${{ needs.changes.outputs.proto == 'true' }}
    name: proto-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required for buf breaking
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Format check (clang-format)
        run: |
          echo "Checking proto file formatting with clang-format..."
          find proto -name "*.proto" -exec clang-format --dry-run -Werror {} \;
          echo "Proto file formatting check passed"
      - name: Setup buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      # TODO: Re-enable when buf supports edition 2024
      # - name: Lint proto files
      #   run: buf lint
      - name: Check for breaking changes
        run: buf breaking --against '.git#branch=main'
        continue-on-error: true
  # Shell script linting
  shell-lint:
    needs: changes
    if: ${{ needs.changes.outputs.shell == 'true' }}
    name: shell-lint
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./scripts"
        # Excluded codes (see make/lint.mk for details):
        # SC2086,SC2034,SC1091,SC2143,SC2181,SC3043,SC3018,SC2016,SC2001,SC2295
        env:
          SHELLCHECK_OPTS: --exclude=SC2086,SC2034,SC1091,SC2143,SC2181,SC3043,SC3018,SC2016,SC2001,SC2295
  # SQL linting with sqlc
  sql-lint:
    needs: changes
    if: ${{ needs.changes.outputs.sql == 'true' }}
    name: sql-lint
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - name: sqlc compile
        run: cd tools/sqlc && sqlc compile
      - name: sqlc vet
        run: cd tools/sqlc && sqlc vet
  # HCL linting with Atlas
  hcl-lint:
    needs: changes
    if: ${{ needs.changes.outputs.hcl == 'true' }}
    name: hcl-lint
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Setup Atlas
        uses: ariga/setup-atlas@v0
      - name: Format check
        run: make atlas-fmt-check
  # TypeScript linting and type checking for xrpl-grpc-server
  ts-lint:
    needs: changes
    if: ${{ needs.changes.outputs.ts == 'true' }}
    name: ts-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Detect proto tool
        id: proto-tool
        run: |
          # Read PROTO_TOOL from Makefile (default: protoc)
          PROTO_TOOL=$(grep -E '^PROTO_TOOL\s*\?=' make/codegen_proto.mk | sed 's/.*?=\s*//' | tr -d ' ')
          echo "tool=${PROTO_TOOL:-protoc}" >> $GITHUB_OUTPUT
          echo "Using proto tool: ${PROTO_TOOL:-protoc}"
      - name: Install protoc
        if: steps.proto-tool.outputs.tool == 'protoc'
        run: |
          # Install protoc v33.4 (supports edition 2024)
          PROTOC_VERSION=33.4
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o "protoc-${PROTOC_VERSION}-linux-x86_64.zip" -d /usr/local
          protoc --version
      - name: Setup buf
        if: steps.proto-tool.outputs.tool == 'buf'
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Install dependencies
        working-directory: apps/xrpl-grpc-server
        run: bun install --frozen-lockfile
      - name: Generate protobuf types
        run: make proto-ts
      - name: Run Biome lint
        working-directory: apps/xrpl-grpc-server
        run: bun run lint
      - name: Run TypeScript type check
        working-directory: apps/xrpl-grpc-server
        run: bun run typecheck
  # Unit tests (only when Go files change)
  unit-test:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    name: unit-test
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run Unit Test
        working-directory: ./
        run: make gotest
