name: docker-build-debug (without BuildKit Cache Dance)

# TODO: pattern, code changed, module added, etc.

# 1. use cache, Dockerfile_without_bindmount (first time):  1m 30s
# 2. use cache, Dockerfile_without_bindmount (second time): 1m 31s
# 3. not cache, Dockerfile_without_bindmount (first time):  1m 41s
# 4. not cache, Dockerfile_without_bindmount (second time): 1m 31s
# 5. use cache, Dockerfile_without_mount (first time):  1m 38s
# 6. use cache, Dockerfile_without_mount (second time): 1m 36s
# 7. not cache, Dockerfile_without_mount (first time):  1m 52s
# 8. not cache, Dockerfile_without_mount (second time): 1m 44s
# 9. use cache, Dockerfile (first time):   1m 30s
# 10. use cache, Dockerfile (second time): 1m 29s
# 11. not cache, Dockerfile (first time):  1m 14s [The best time]
# 12. not cache, Dockerfile (second time): 1m 21s
# Compare cache type: gha / local / registry / none at No.11
# 13. cache type: `none` (first time):   1m 30s
# 14. cache type: `none` (second time):  1m 23s
# 15. cache type: `gha` (first time):    1m 23s
# 16. cache type: `gha` (second time):   1m 33s
# 17. cache type: `local` (first time):  1m 34s
# 18. cache type: `local` (second time): 1m 42s
# 19. cache type: `registry` (first time):  1m 36s
# 20. cache type: `registry` (second time): 1m 23s [The best time in cache type]

on:
  workflow_dispatch:
    inputs:
      cache_type:
        description: "Cache type to use"
        type: choice
        required: true
        default: "none"
        options:
          - "none"
          - "gha"
          - "local"
          - "registry"
      dockerfile:
        description: "Dockerfile path"
        type: choice
        required: true
        default: "./docker/Dockerfile"
        options:
          - "./docker/Dockerfile" # with BuildKit cache mount + bind mount
          - "./docker/Dockerfile_without_bindmount"
          - "./docker/Dockerfile_without_cachemount"
          - "./docker/Dockerfile_without_mount"
      run_twice:
        description: "Build twice in the same job to verify cache hits"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write # for cache type=gha
  packages: write # for cache type=registry (GHCR)
env:
  DOCKERFILE: ${{ inputs.dockerfile }}
  CMD_PATH: cmd/watch
  LOCAL_CACHE_PATH: /tmp/.buildx-cache
  # For registry cache, set your registry ref (e.g., ghcr.io/your-org/your-repo:cache)
  REGISTRY_CACHE_REF: ghcr.io/${{ github.repository }}:buildcache

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (fetch tags)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # docker driver では cache-to type=gha がexportできない
      - name: Set up Buildx (docker-container driver)
        uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          driver: docker-container

      # Login to GHCR for registry cache
      - name: Login to GitHub Container Registry
        if: inputs.cache_type == 'registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get APP_VERSION from git
        id: version
        run: |
          APP_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "APP_VERSION: ${APP_VERSION}"

      - name: Set cache configuration
        id: cache-config
        run: |
          CACHE_SCOPE="go-${{ hashFiles(env.DOCKERFILE, 'go.mod', 'go.sum') }}"
          case "${{ inputs.cache_type }}" in
            gha)
              echo "cache-from=type=gha,scope=${CACHE_SCOPE}" >> $GITHUB_OUTPUT
              echo "cache-to=type=gha,mode=max,scope=${CACHE_SCOPE}" >> $GITHUB_OUTPUT
              ;;
            local)
              echo "cache-from=type=local,src=${{ env.LOCAL_CACHE_PATH }}" >> $GITHUB_OUTPUT
              echo "cache-to=type=local,dest=${{ env.LOCAL_CACHE_PATH }}-new,mode=max" >> $GITHUB_OUTPUT
              ;;
            registry)
              echo "cache-from=type=registry,ref=${{ env.REGISTRY_CACHE_REF }}" >> $GITHUB_OUTPUT
              echo "cache-to=type=registry,ref=${{ env.REGISTRY_CACHE_REF }},mode=max" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "cache-from=" >> $GITHUB_OUTPUT
              echo "cache-to=" >> $GITHUB_OUTPUT
              ;;
          esac
          echo "Cache type: ${{ inputs.cache_type }}"

      # Restore local cache if using local cache type
      - name: Restore local cache
        if: inputs.cache_type == 'local'
        uses: actions/cache@v5
        with:
          path: ${{ env.LOCAL_CACHE_PATH }}
          key: buildx-${{ hashFiles(env.DOCKERFILE, 'go.mod', 'go.sum') }}
          restore-keys: |
            buildx-

      # First: always run
      - name: Build (first)
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ${{ env.DOCKERFILE }}
          push: false
          build-args: |
            CMD_PATH=${{ env.CMD_PATH }}
            APP_VERSION=${{ steps.version.outputs.app_version }}
          cache-from: ${{ steps.cache-config.outputs.cache-from }}
          cache-to: ${{ steps.cache-config.outputs.cache-to }}

      # Second: check how it works by cache for debugging
      - name: Build (second; should be faster if caches work)
        if: ${{ inputs.run_twice }}
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ${{ env.DOCKERFILE }}
          push: false
          build-args: |
            CMD_PATH=${{ env.CMD_PATH }}
            APP_VERSION=${{ steps.version.outputs.app_version }}
          cache-from: ${{ steps.cache-config.outputs.cache-from }}
          cache-to: ${{ steps.cache-config.outputs.cache-to }}

      # Move local cache for next run (avoids cache size growth)
      - name: Move local cache
        if: inputs.cache_type == 'local'
        run: |
          rm -rf ${{ env.LOCAL_CACHE_PATH }}
          mv ${{ env.LOCAL_CACHE_PATH }}-new ${{ env.LOCAL_CACHE_PATH }} || true
