name: "go-docker-build (cache selectable)"
description: "Build Docker image with Buildx. Cache type selectable (none/gha/local/registry). Default: no cache, Dockerfile_mounts."

# How to use this action:
# - name: Build image
#   uses: ./.github/actions/go-docker-build
#   with:
#     cache_type: ${{ inputs.cache_type }}
#     dockerfile: ${{ inputs.dockerfile }}

inputs:
  cache_type:
    description: "Cache type to use (none|gha|local|registry)"
    required: false
    default: "none"
  dockerfile:
    description: "Dockerfile path"
    required: false
    default: "./docker/Dockerfile_mounts"
  cmd_path:
    description: "Go cmd path passed to Docker build as CMD_PATH"
    required: false
    default: "cmd/watch"
  image_tag:
    description: "Image tag. If empty, use git tag (git describe --tags --abbrev=0) or 'dev'."
    required: false
    default: ""
  local_cache_path:
    description: "Path for local buildx cache"
    required: false
    default: "/tmp/.buildx-cache"
  registry_cache_ref:
    description: "Registry cache ref (used when cache_type=registry). If empty, default ghcr.io/<owner>/<repo>:buildcache"
    required: false
    default: ""

  # push/tag/labels
  push:
    description: "Whether to push image to registry (true|false)"
    required: false
    default: "false"
  tags:
    description: "Docker image tags (newline or comma separated). Typically from docker/metadata-action outputs.tags"
    required: false
    default: ""
  labels:
    description: "Docker image labels (newline separated). Typically from docker/metadata-action outputs.labels"
    required: false
    default: ""
  # e.g main:true、tag:false
  write_cache:
    description: "Whether to write cache (cache-to) (true|false)"
    required: false
    default: "false"

outputs:
  app_version:
    description: "Resolved app version"
    value: ${{ steps.version.outputs.app_version }}
  cache_scope:
    description: "Resolved cache scope"
    value: ${{ steps.cache-config.outputs.cache_scope }}

runs:
  using: "composite"
  steps:
    # Buildx (docker-container driver)
    - name: Set up Buildx (docker-container driver)
      uses: docker/setup-buildx-action@v3
      id: buildx
      with:
        driver: docker-container

    # Login to GHCR (needed for push and/or registry cache)
    - name: Login to GitHub Container Registry
      if: ${{ inputs.push == 'true' || inputs.cache_type == 'registry' }}
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Resolve APP_VERSION
      id: version
      shell: bash
      run: |
        set -euo pipefail

        if [[ -n "${{ inputs.image_tag }}" ]]; then
          APP_VERSION="${{ inputs.image_tag }}"
        else
          APP_VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo dev)"
        fi

        echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
        echo "APP_VERSION: ${APP_VERSION}"

    # Cache config (outputs cache_from/cache_to strings)
    - name: Set cache configuration
      id: cache-config
      shell: bash
      run: |
        set -euo pipefail

        LOCAL_CACHE_PATH="${{ inputs.local_cache_path }}"
        CACHE_TYPE="${{ inputs.cache_type }}"

        # default registry cache ref
        if [[ -n "${{ inputs.registry_cache_ref }}" ]]; then
          REGISTRY_CACHE_REF="${{ inputs.registry_cache_ref }}"
        else
          REGISTRY_CACHE_REF="ghcr.io/${{ github.repository }}:buildcache"
        fi

        # cache scope derived from Dockerfile + go.mod/go.sum
        HF="${{ hashFiles(inputs.dockerfile, 'go.mod', 'go.sum') }}"
        CACHE_SCOPE="go-$(sha256sum <(printf "%s" "${HF}") | awk '{print $1}')"

        echo "cache_scope=${CACHE_SCOPE}" >> "$GITHUB_OUTPUT"
        echo "registry_cache_ref=${REGISTRY_CACHE_REF}" >> "$GITHUB_OUTPUT"

        CACHE_FROM=""
        CACHE_TO=""

        case "${CACHE_TYPE}" in
          gha)
            CACHE_FROM="type=gha,scope=${CACHE_SCOPE}"
            CACHE_TO="type=gha,mode=max,scope=${CACHE_SCOPE}"
            ;;
          local)
            CACHE_FROM="type=local,src=${LOCAL_CACHE_PATH}"
            CACHE_TO="type=local,dest=${LOCAL_CACHE_PATH}-new,mode=max"
            ;;
          registry)
            CACHE_FROM="type=registry,ref=${REGISTRY_CACHE_REF}"
            CACHE_TO="type=registry,ref=${REGISTRY_CACHE_REF},mode=max"
            ;;
          *)
            CACHE_FROM=""
            CACHE_TO=""
            ;;
        esac

        echo "cache_from=${CACHE_FROM}" >> "$GITHUB_OUTPUT"
        echo "cache_to=${CACHE_TO}" >> "$GITHUB_OUTPUT"

        echo "Cache type: ${CACHE_TYPE}"
        echo "Cache scope: ${CACHE_SCOPE}"

    # Restore local cache (only when local)
    - name: Restore local cache
      if: ${{ inputs.cache_type == 'local' }}
      uses: actions/cache@v5
      with:
        path: ${{ inputs.local_cache_path }}
        key: buildx-${{ hashFiles(inputs.dockerfile, 'go.mod', 'go.sum') }}
        restore-keys: |
          buildx-

    # -----------------------------
    # Build & (optional) push
    # - pass cache-to when write_cache=true
    # -----------------------------
    - name: Build & push (with cache-to)
      if: ${{ inputs.write_cache == 'true' }}
      uses: docker/build-push-action@v6
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push == 'true' }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        build-args: |
          CMD_PATH=${{ inputs.cmd_path }}
          APP_VERSION=${{ steps.version.outputs.app_version }}
        cache-from: ${{ steps.cache-config.outputs.cache_from }}
        cache-to: ${{ steps.cache-config.outputs.cache_to }}

    - name: Build & push (no cache-to)
      if: ${{ inputs.write_cache != 'true' }}
      uses: docker/build-push-action@v6
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push == 'true' }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        build-args: |
          CMD_PATH=${{ inputs.cmd_path }}
          APP_VERSION=${{ steps.version.outputs.app_version }}
        cache-from: ${{ steps.cache-config.outputs.cache_from }}

    # Move local cache only when we wrote it (local + write_cache=true)
    - name: Move local cache
      if: ${{ inputs.cache_type == 'local' && inputs.write_cache == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        rm -rf "${{ inputs.local_cache_path }}"
        mv "${{ inputs.local_cache_path }}-new" "${{ inputs.local_cache_path }}" || true
