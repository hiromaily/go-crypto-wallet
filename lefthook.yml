pre-commit:
  parallel: true
  jobs:
    # go mod files
    - name: go-mod-tidy
      root: "/"
      glob: "**/go.{mod,sum}"
      run: |
        go mod tidy
        git add go.mod go.sum # files may be changed so add to stage
      stage_fixed: true

    # go files
    - name: go-fmt # lightweight lint only for fast pre-commit
      root: "/"
      glob: "**/*.{go}"
      run: |
        make go-fmt
      stage_fixed: true

    # - name: go-unit-test
    #   root: "/"
    #   glob: "**/*.{go}"
    #   run: |
    #     make gotest
    #   stage_fixed: false

    # shell scripts
    - name: sh-fmt
      root: "/scripts"
      glob: "**/*.{sh}"
      run: |
        make shfmt
      stage_fixed: true

    # Makefile
    - name: makefile-fmt
      root: "/"
      glob: "**/*.{mk,Makefile}"
      run: |
        make mk-lint
      stage_fixed: true

    # YAML files
    - name: yaml-fmt
      root: "/"
      glob: "**/*.{yaml,yml}"
      run: |
        make yaml-lint
      stage_fixed: true

    # Atlas HCL files
    - name: hcl-fmt
      root: "/"
      glob: "tools/atlas/**/*.hcl"
      run: |
        make hcl-fmt
      stage_fixed: true

    # SQL files (format)
    - name: sql-fmt
      root: "/"
      glob: "tools/sqlc/**/*.sql"
      run: |
        make sql-fmt
      stage_fixed: true

    # sqlc config and queries (validate)
    - name: sqlc-lint
      root: "/"
      glob: "tools/sqlc/**/*.{sql,yml}"
      run: |
        make sqlc-lint
      stage_fixed: false

    # Proto files (format)
    - name: proto-fmt
      root: "/"
      glob: "proto/**/*.proto"
      run: |
        make proto-fmt
      stage_fixed: true

    # Proto files (lint)
    - name: proto-lint
      root: "/"
      glob: "proto/**/*.proto"
      run: |
        make proto-lint
      stage_fixed: false
