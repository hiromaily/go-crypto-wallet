# mockery v3 configuration
# https://vektra.github.io/mockery/latest/configuration/
#
# To generate mocks, run: make mockery
#
# Mocks are placed in a `mocks/` subdirectory alongside the implementation code.
# This makes it easy to find mocks when working with the related code.

all: false
filename: "mock_{{.InterfaceName | snakecase}}.go"
structname: "Mock{{.InterfaceName}}"
template: testify
formatter: goimports
log-level: info

packages:
  # Bitcoin API - interface in application/ports, implementation in infrastructure
  github.com/hiromaily/go-crypto-wallet/internal/application/ports/api/btc:
    config:
      dir: "internal/infrastructure/api/btc/mocks"
      pkgname: "mocks"
    interfaces:
      Bitcoiner:

  # Ripple API - interface in application/ports, implementation in infrastructure
  github.com/hiromaily/go-crypto-wallet/internal/application/ports/api/xrp:
    config:
      dir: "internal/infrastructure/api/xrp/mocks"
      pkgname: "mocks"
    interfaces:
      Rippler:
      RippleAPIer:
      RipplePublicer:
      RippleAdminer:

  # File storage - interface in application/ports, implementation in infrastructure
  github.com/hiromaily/go-crypto-wallet/internal/application/ports/file:
    config:
      dir: "internal/infrastructure/storage/file/transaction/mocks"
      pkgname: "mocks"
    interfaces:
      TransactionFileRepositorier:
      AddressFileRepositorier:

  # Watch wallet persistence interfaces
  github.com/hiromaily/go-crypto-wallet/internal/application/ports/repository/watch:
    config:
      dir: "internal/infrastructure/repository/watch/mocks"
      pkgname: "mocks"
    interfaces:
      AddressRepositorier:
      BTCTxRepositorier:
      TxInputRepositorier:
      TxOutputRepositorier:
      PaymentRequestRepositorier:
      TxRepositorier:
      ETHDetailTXRepositorier:
      XRPDetailTXRepositorier:

  # Cold wallet persistence interfaces
  github.com/hiromaily/go-crypto-wallet/internal/application/ports/repository/cold:
    config:
      dir: "internal/infrastructure/repository/cold/mocks"
      pkgname: "mocks"
    interfaces:
      SeedRepositorier:
      BTCAccountKeyRepositorier:
      ETHAccountKeyRepositorier:
      XRPAccountKeyRepositorier:
      AuthFullPubkeyRepositorier:
      AuthAccountKeyRepositorier:
