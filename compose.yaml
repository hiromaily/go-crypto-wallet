volumes:
  wallet-db: {}

networks:
  db:
    name: db
    driver: bridge

services:
  #########################################################################
  # Database
  #########################################################################
  # Consolidated wallet database with schema separation
  #
  # Note: MySQL 8.4 uses caching_sha2_password authentication plugin by default,
  # which requires SSL connection. If you encounter the error:
  #   "Authentication plugin 'caching_sha2_password' reported error: Authentication requires secure connection."
  #
  # To connect from local machine, enable SSL in your connection:
  #   - MySQL CLI: mysql -h localhost -u hiromaily -p --ssl-mode=REQUIRED
  #   - Connection string: mysql://user:pass@localhost:3306/db?tls=true
  #   - Go DSN: user:pass@tcp(localhost:3306)/db?tls=true
  #
  wallet-db:
    image: mysql:8.4
    container_name: wallet-db
    volumes:
      - wallet-db:/var/lib/mysql
      - "./docker/mysql/conf.d:/etc/mysql/conf.d"
      - "./docker/mysql/init.d:/docker-entrypoint-initdb.d"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: hiromaily
      MYSQL_PASSWORD: hiromaily
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - db
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  #########################################################################
  # Database Migration (Atlas)
  #########################################################################
  # Atlas migration services for database schema management
  # These services automatically run migrations when the database is ready.
  # Each service applies migrations for one schema and exits.
  #
  # When you run `docker compose up`, these services will:
  #   1. Wait for wallet-db to be healthy (depends_on with condition: service_healthy)
  #   2. Automatically apply migrations for each schema
  #   3. Exit after completion (restart: "no")
  #
  # Manual usage via Makefile:
  #   - Check status: make atlas-status-docker
  #   - Rollback: make atlas-rollback-docker SCHEMA=watch
  #   - Validate: make atlas-validate-docker
  #   - Create new migration: make atlas-new-docker SCHEMA=watch NAME=add_table
  #
  # Refer to https://hub.docker.com/r/arigaio/atlas/tags
  wallet-db-migrate-watch:
    image: arigaio/atlas:1.0.0
    container_name: wallet-db-migrate-watch
    volumes:
      - "./tools/atlas:/app/atlas"
    working_dir: /app/atlas
    depends_on:
      wallet-db:
        condition: service_healthy
    networks:
      - db
    environment:
      - ATLAS_NO_UPDATE_NOTIFIER=true
    command:
      - migrate
      - apply
      - --dir
      - file://migrations/watch
      - --url
      - "mysql://root:root@wallet-db:3306/watch?charset=utf8mb4&parseTime=True&loc=Local"
    restart: "no"

  wallet-db-migrate-keygen:
    image: arigaio/atlas:1.0.0
    container_name: wallet-db-migrate-keygen
    volumes:
      - "./tools/atlas:/app/atlas"
    working_dir: /app/atlas
    depends_on:
      wallet-db:
        condition: service_healthy
    networks:
      - db
    environment:
      - ATLAS_NO_UPDATE_NOTIFIER=true
    command:
      - migrate
      - apply
      - --dir
      - file://migrations/keygen
      - --url
      - "mysql://root:root@wallet-db:3306/keygen?charset=utf8mb4&parseTime=True&loc=Local"
    restart: "no"

  wallet-db-migrate-sign:
    image: arigaio/atlas:1.0.0
    container_name: wallet-db-migrate-sign
    volumes:
      - "./tools/atlas:/app/atlas"
    working_dir: /app/atlas
    depends_on:
      wallet-db:
        condition: service_healthy
    networks:
      - db
    environment:
      - ATLAS_NO_UPDATE_NOTIFIER=true
    command:
      - migrate
      - apply
      - --dir
      - file://migrations/sign
      - --url
      - "mysql://root:root@wallet-db:3306/sign?charset=utf8mb4&parseTime=True&loc=Local"
    restart: "no"
