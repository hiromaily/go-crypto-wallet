#
# This compose.yaml contains only the Database service.
#
# [reset]
# docker compose down -v
# [mysql]
#	docker compose --profile mysql up
# [postgres]
#	docker compose --profile postgres up

volumes:
  wallet-mysql: {}
  wallet-postgres: {}

networks:
  db:
    name: db
    driver: bridge

# Note: The migration services below use YAML anchors (&migration-base) and aliases
#       (<<: *migration-base) to share common configuration. This reduces duplication
#       and makes maintenance easier. The `x-migration-base` is an extension field
#       (ignored by Docker Compose) that defines the common template, and each service
#       inherits from it using the merge key (<<:) and only overrides schema-specific
#       values (container_name, command parameters).
#       [references]: https://docs.docker.com/reference/compose-file/extension/
#
# Common migration service configuration template
# Using YAML anchor (&mysql-migration-base) to define reusable configuration
x-postgres-migration-base: &postgres-migration-base
  image: arigaio/atlas:1.1.0
  profiles: ["postgres"]
  volumes:
    - "./tools/atlas:/app/atlas"
  working_dir: /app/atlas
  depends_on:
    wallet-postgres:
      condition: service_healthy
  networks:
    - db
  environment:
    - ATLAS_NO_UPDATE_NOTIFIER=true
  restart: "no"

x-mysql-migration-base: &mysql-migration-base
  image: arigaio/atlas:1.1.0
  profiles: ["mysql"]
  volumes:
    - "./tools/atlas:/app/atlas"
  working_dir: /app/atlas
  depends_on:
    wallet-mysql:
      condition: service_healthy
  networks:
    - db
  environment:
    - ATLAS_NO_UPDATE_NOTIFIER=true
  restart: "no"

services:
  #########################################################################
  # PostgreSQL Database
  #########################################################################
  wallet-postgres:
    image: postgres:18.2
    profiles: ["postgres"]
    container_name: wallet-postgres
    volumes:
      # IMPORTANT: PostgreSQL 18+ uses version-specific subdirectories under /var/lib/postgresql
      # (e.g., /var/lib/postgresql/18/main). Do NOT use /var/lib/postgresql/data here.
      # See: https://github.com/docker-library/postgres/pull/1259
      - wallet-postgres:/var/lib/postgresql
      - "./docker/postgres/init.d:/docker-entrypoint-initdb.d"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRESQL_PORT:-5432}:5432"
    networks:
      - db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  #########################################################################
  # MySQL Database
  #########################################################################
  # Consolidated wallet database with schema separation
  #
  # Note: MySQL 8.4 uses caching_sha2_password authentication plugin by default,
  # which requires SSL connection. If you encounter the error:
  #   "Authentication plugin 'caching_sha2_password' reported error: Authentication requires secure connection."
  #
  # To connect from local machine, enable SSL in your connection:
  #   - MySQL CLI: mysql -h localhost -u hiromaily -p --ssl-mode=REQUIRED
  #   - Connection string: mysql://user:pass@localhost:3306/db?tls=true
  #   - Go DSN: user:pass@tcp(localhost:3306)/db?tls=true
  #
  wallet-mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    container_name: wallet-mysql
    volumes:
      - wallet-mysql:/var/lib/mysql
      - "./docker/mysql/conf.d:/etc/mysql/conf.d"
      - "./docker/mysql/init.d:/docker-entrypoint-initdb.d"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: hiromaily
      MYSQL_PASSWORD: hiromaily
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  #########################################################################
  # PostgreSQL Migration (Atlas)
  #########################################################################
  # PostgreSQL migration services - same pattern as MySQL but for PostgreSQL
  # Activated with `docker compose --profile postgres up`

  wallet-postgres-migrate-watch:
    !!merge <<: *postgres-migration-base
    container_name: wallet-postgres-migrate-watch
    command:
      - migrate
      - apply
      - --dir
      - "file://migrations/postgres/watch"
      - --url
      - "postgres://postgres:postgres@wallet-postgres:5432/watch?sslmode=disable"

  wallet-postgres-migrate-keygen:
    !!merge <<: *postgres-migration-base
    container_name: wallet-postgres-migrate-keygen
    command:
      - migrate
      - apply
      - --dir
      - "file://migrations/postgres/keygen"
      - --url
      - "postgres://postgres:postgres@wallet-postgres:5432/keygen?sslmode=disable"

  wallet-postgres-migrate-sign:
    !!merge <<: *postgres-migration-base
    container_name: wallet-postgres-migrate-sign
    command:
      - migrate
      - apply
      - --dir
      - "file://migrations/postgres/sign"
      - --url
      - "postgres://postgres:postgres@wallet-postgres:5432/sign?sslmode=disable"

  wallet-postgres-migrate-sign2:
    !!merge <<: *postgres-migration-base
    container_name: wallet-postgres-migrate-sign2
    command:
      - migrate
      - apply
      - --dir
      - "file://migrations/postgres/sign"
      - --url
      - "postgres://postgres:postgres@wallet-postgres:5432/sign2?sslmode=disable"

  #########################################################################
  # Database Migration (Atlas)
  #########################################################################
  # Atlas migration services for database schema management
  # These services automatically run migrations when the database is ready.
  # Each service applies migrations for one schema and exits.
  #
  # When you run `docker compose --profile mysql up`, these services will:
  #   1. Wait for wallet-mysql to be healthy (depends_on with condition: service_healthy)
  #   2. Automatically apply migrations for each schema
  #   3. Exit after completion (restart: "no")
  #
  # Manual usage via Makefile:
  #   - Check status: make atlas-status-docker
  #   - Rollback: make atlas-rollback-docker SCHEMA=watch
  #   - Validate: make atlas-validate-docker
  #   - Create new migration: make atlas-new-docker SCHEMA=watch NAME=add_table
  #
  # Refer to https://hub.docker.com/r/arigaio/atlas/tags
  #
  # Watch schema migration service
  # Inherits common configuration from &migration-base using <<: *migration-base
  wallet-mysql-migrate-watch:
    !!merge <<: *mysql-migration-base
    container_name: wallet-mysql-migrate-watch
    command:
      - migrate
      - apply
      - --dir
      - file://migrations/mysql/watch
      - --url
      - "mysql://root:root@wallet-mysql:3306/watch?charset=utf8mb4&parseTime=True&loc=Local"

  # Keygen schema migration service
  # Inherits common configuration from &migration-base using <<: *migration-base
  wallet-mysql-migrate-keygen:
    !!merge <<: *mysql-migration-base
    container_name: wallet-mysql-migrate-keygen
    command:
      - migrate
      - apply
      - --dir
      - file://migrations/mysql/keygen
      - --url
      - "mysql://root:root@wallet-mysql:3306/keygen?charset=utf8mb4&parseTime=True&loc=Local"

  # Sign schema migration service
  # Inherits common configuration from &migration-base using <<: *migration-base
  wallet-mysql-migrate-sign:
    !!merge <<: *mysql-migration-base
    container_name: wallet-mysql-migrate-sign
    command:
      - migrate
      - apply
      - --dir
      - file://migrations/mysql/sign
      - --url
      - "mysql://root:root@wallet-mysql:3306/sign?charset=utf8mb4&parseTime=True&loc=Local"

  # Sign2 schema migration service (separate database for second sign wallet)
  # Inherits common configuration from &migration-base using <<: *migration-base
  wallet-mysql-migrate-sign2:
    !!merge <<: *mysql-migration-base
    container_name: wallet-mysql-migrate-sign2
    command:
      - migrate
      - apply
      - --dir
      - file://migrations/mysql/sign
      - --url
      - "mysql://root:root@wallet-mysql:3306/sign2?charset=utf8mb4&parseTime=True&loc=Local"
