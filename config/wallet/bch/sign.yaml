# =============================================================================
# BCH Sign Wallet Configuration
# =============================================================================
# All values can be overridden by environment variables with WALLET_ prefix.
# Priority: Environment Variables > Config File > Default Values
#
# Examples:
#   WALLET_ADDRESS_TYPE=bch-cashaddr
#   WALLET_BITCOIN_HOST=127.0.0.1:19332
#   WALLET_MYSQL_HOST=localhost:3306
#   WALLET_LOGGER_LEVEL=info
#
# See pkg/config/README.md for full documentation.
# =============================================================================
coin_type: "bch" # btc, bch
address_type: "bch-cashaddr" # p2sh-segwit, bech32, bch-cashaddr
bitcoin:
  host: "127.0.0.1:19332"
  # Using /wallet/<name> path requires pre-created wallet via `bitcoin-cli createwallet <name>`.
  # See: scripts/operation/btc/create-bitcoind-wallet.sh
  # if specific wallet want to be used like `bitcoin-cli -rpcwallet=sign`
  # host: "127.0.0.1:19332/wallet/sign"
  user: "xyz"
  pass: "xyz"
  http_post_mode: true
  disable_tls: true
  network_type: "testnet3" # mainnet, testnet3, regtest
logger:
  service: "bch-sign"
  format: "json" # json, console
  level: "debug" # debug, info, warn, error
  is_stacktrace: true
# only available for watch only wallet, but definition is required as none
tracer:
  type: "none" # none, jaeger, datadog
# Database configuration - choose between mysql or sqlite
database:
  type: "sqlite" # mysql, sqlite
  mysql:
    host: "127.0.0.1:3306"
    dbname: "sign"
    user: "hiromaily"
    pass: "hiromaily"
    debug: true
  sqlite:
    path: "./data/sqlite/bch/sign.db"
    debug: true
file_path:
  tx: "./data/tx/bch/"
  address: "./data/address/bch/"
  full_pubkey: "./data/fullpubkey/bch/"
