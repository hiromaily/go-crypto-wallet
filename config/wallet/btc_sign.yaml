# =============================================================================
# BTC Sign Wallet Configuration
# =============================================================================
# All values can be overridden by environment variables with WALLET_ prefix.
# Priority: Environment Variables > Config File > Default Values
#
# Examples:
#   WALLET_ADDRESS_TYPE=p2sh-segwit
#   WALLET_BITCOIN_HOST=127.0.0.1:20332
#   WALLET_MYSQL_HOST=localhost:3306
#   WALLET_LOGGER_LEVEL=info
#
# See pkg/config/README.md for full documentation.
# =============================================================================

# coin_type: "btc" # btc, bch
# address_type options:
#   - legacy:      P2PKH (Legacy addresses starting with 1)
#   - p2sh-segwit: P2SH-wrapped SegWit (P2SH-P2WPKH/P2SH-P2WSH, addresses starting with 3)
#   - bech32:      Native SegWit (P2WPKH/P2WSH, addresses starting with bc1q)
#   - taproot:     Taproot (P2TR, addresses starting with bc1p)
address_type: "p2sh-segwit"

bitcoin:
  host: "127.0.0.1:20332"
  # Using /wallet/<name> path requires pre-created wallet via `bitcoin-cli createwallet <name>`.
  # See: scripts/operation/btc/create-bitcoind-wallet.sh
  # if specific wallet want to be used like `bitcoin-cli -rpcwallet=sign`
  #host = "127.0.0.1:18332/wallet/sign"
  user: "xyz"
  pass: "xyz"
  http_post_mode: true
  disable_tls: true
  network_type: "regtest" # mainnet, testnet3, regtest, signet

logger:
  service: "btc-sign"
  format: "json" # json, console
  level: "debug" # debug, info, warn, error
  is_stacktrace: true

# only available for watch only wallet, but definition is required as none
tracer:
  type: "none" # none, jaeger, datadog

mysql:
  host: "127.0.0.1:3306"
  dbname: "sign"
  user: "hiromaily"
  pass: "hiromaily"
  debug: true

file_path:
  tx: "./data/tx/btc/"
  address: "./data/address/btc/"
  full_pubkey: "./data/fullpubkey/btc/"
