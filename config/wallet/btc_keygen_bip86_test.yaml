# coin_type: "btc" # btc, bch
key_type: "bip86" # bip44, bip49, bip84, bip86, musig2
# address_type options:
#   - legacy:      P2PKH (Legacy addresses starting with 1)
#   - p2sh-segwit: P2SH-wrapped SegWit (P2SH-P2WPKH/P2SH-P2WSH, addresses starting with 3)
#   - bech32:      Native SegWit (P2WPKH/P2WSH, addresses starting with bc1q)
#   - taproot:     Taproot (P2TR, addresses starting with bc1p)
address_type: "taproot"

bitcoin:
  host: "127.0.0.1:19332"
# if specific wallet want to be used like `bitcoin-cli -rpcwallet=keygen`
# host: "127.0.0.1:18332/wallet/keygen"
  user: "xyz"
  pass: "xyz"
  http_post_mode: true
  disable_tls: true
  network_type: "signet"  # mainnet, testnet3, regtest, signet

logger:
  service: "btc-keygen-bip86-test"
  format: "json"  # json, console
  level: "debug"  # debug, info, warn, error
  is_stacktrace: true

# only available for watch only wallet, but definition is required as none
tracer:
  type: "none"  # none, jaeger, datadog

mysql:
  host: "127.0.0.1:3306"
  dbname: "keygen_bip86_test"
  user: "hiromaily"
  pass: "hiromaily"
  debug: true

file_path:
  tx: "./data/tx/btc/bip86_test/"
  address: "./data/address/btc/bip86_test/"
  full_pubkey: "./data/fullpubkey/btc/bip86_test/"

# Test seed for BIP86 integration testing
key:
  seed: "Ve5Kkaba4SQGavc/pWXazZuYD4mE53+qV9tLeRTS5t4="

