# =============================================================================
# BTC Watch Wallet Configuration
# =============================================================================
# All values can be overridden by environment variables with WALLET_ prefix.
# Priority: Environment Variables > Config File > Default Values
#
# Examples:
#   WALLET_ADDRESS_TYPE=legacy
#   WALLET_BITCOIN_HOST=127.0.0.1:18332
#   WALLET_MYSQL_HOST=localhost:3306
#   WALLET_LOGGER_LEVEL=info
#
# See pkg/config/README.md for full documentation.
# =============================================================================
# coin_type: "btc"  # btc, bch
# address_type options:
#   - legacy:      P2PKH (Legacy addresses starting with 1) -> derives key_type: bip44
#   - p2sh-segwit: P2SH-wrapped SegWit (addresses starting with 3) -> derives key_type: bip49
#   - bech32:      Native SegWit (addresses starting with bc1q) -> derives key_type: bip84
#   - taproot:     Taproot (addresses starting with bc1p) -> derives key_type: bip86
# Note: key_type is automatically derived from address_type (see AddrType.ToKeyType())
address_type: "p2sh-segwit"
bitcoin:
  # Using /wallet/<name> path requires pre-created wallet via `bitcoin-cli createwallet <name>`.
  # See: scripts/operation/btc/create-bitcoind-wallet.sh
  # if specific wallet want to be used like `bitcoin-cli -rpcwallet=watch`
  host: "127.0.0.1:18332/wallet/watch"
  user: "xyz"
  pass: "xyz"
  http_post_mode: true
  disable_tls: true
  network_type: "regtest" # mainnet, testnet3, regtest, signet
  block:
    confirmation_num: 3 # block number for required confirmation
  fee:
    adjustment_min: 0.5 # adjustable minimum fee magnification
    adjustment_max: 2.0 # adjustable maximum fee magnification
logger:
  service: "btc-wallet"
  format: "json" # json, console
  level: "debug" # debug, info, warn, error
  is_stacktrace: true
# only available for watch only wallet
tracer:
  type: "none" # none, jaeger, datadog
  jaeger:
    service_name: "btc-wallet"
    collector_endpoint: "http://127.0.0.1:14268/api/traces"
    sampling_probability: 0.5 # 0.001 to 1.0
# Database configuration - choose between mysql or sqlite
database:
  type: "sqlite" # mysql, sqlite
  mysql:
    host: "127.0.0.1:3306"
    dbname: "watch"
    user: "hiromaily"
    pass: "hiromaily"
    debug: true
  sqlite:
    path: "./data/sqlite/btc/watch.db"
    # max_open_conns: Maximum number of open connections to the database.
    # IMPORTANT: Do NOT set to 1 - causes deadlock when read query is followed by Begin().
    # Minimum recommended: 2 (allows concurrent read + write operations)
    # Default: 2 (if not specified or set to 0)
    max_open_conns: 2
    debug: true
file_path:
  tx: "./data/tx/btc/"
  address: "./data/address/btc/"
  full_pubkey: "./data/fullpubkey/btc/"
