# =============================================================================
# XRP Keygen Wallet Configuration
# =============================================================================
# All values can be overridden by environment variables with WALLET_ prefix.
# Priority: Environment Variables > Config File > Default Values
#
# Examples:
#   WALLET_RIPPLE_WEBSOCKET_PUBLIC_URL=wss://127.0.0.1:6005
#   WALLET_MYSQL_HOST=localhost:3306
#   WALLET_LOGGER_LEVEL=info
#
# See pkg/config/README.md for full documentation.
# =============================================================================
ripple:
  # on production, it should run offline

  # https://xrpl.org/get-started-with-the-rippled-api.html
  #websocket_public_url = "wss://127.0.0.1:6005"
  #websocket_admin_url = "ws://127.0.0.1:6006"
  websocket_public_url: ""
  websocket_admin_url: ""
  network_type: "standalone" # mainnet, testnet, devnet, standalone

  # Key generation settings
  # offline_keygen: Enable fully offline key generation (recommended for production)
  # When true, keys are generated using native Go implementation without API calls.
  # When false, keys are generated via xrp functionality (wallet_propose).
  offline_keygen: true

  # key_algorithm: Cryptographic algorithm for key generation
  # - "ed25519": Modern, recommended algorithm (shorter signatures, deterministic)
  # - "secp256k1": Legacy algorithm (same as Bitcoin)
  # Default: "ed25519" if not specified
  key_algorithm: "ed25519"

  api:
    url: "127.0.0.1:50051"
    is_secure: false
logger:
  service: "xrp-keygen"
  format: "json" # json, console
  level: "debug" # debug, info, warn, error
  is_stacktrace: false
# only available for watch only wallet
tracer:
  type: "none" # none, jaeger, datadog
# Database configuration - choose between mysql or sqlite
database:
  type: "sqlite" # mysql, sqlite
  mysql:
    # host: "192.168.10.101:3308"
    host: "127.0.0.1:3306"
    dbname: "keygen"
    user: "hiromaily"
    pass: "hiromaily"
    debug: false
  sqlite:
    path: "./data/sqlite/xrp/keygen.db"
    max_open_conns: 2
    debug: true
file_path:
  tx: "./data/tx/xrp/"
  address: "./data/address/xrp/"
  full_pubkey: "./data/fullpubkey/xrp/"
